<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TapFlow Solutions</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" href="assets/images/logo.png" type="image/png">

    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
        }

        body {
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background-color: #F3F4F6;
            overflow: hidden;
            background-image:
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid #E5E7EB;
        }

        .login-header img {
            height: 48px;
            margin-bottom: 1rem;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111827;
            margin: 0 0 0.5rem 0;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4B5563;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 10px;
            border: 1px solid #D1D5DB;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            /* Critical for layout */
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-dark);
        }

        .error-msg {
            background: #FEE2E2;
            color: #991B1B;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            border: 1px solid #FECACA;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <img src="assets/images/logo.png" alt="TapFlow">
            <h2>Partner Access</h2>
            <p style="color: #6B7280; font-size: 0.9rem;">Manage your smart restaurant.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i data-lucide="mail" size="18" class="input-icon"></i>
                    <input type="email" id="email" class="form-control" placeholder="name@restaurant.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock" size="18" class="input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span>Login</span>
                <i data-lucide="arrow-right" size="18"></i>
            </button>
            <div id="error-message" class="error-msg"></div>
        </form>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Config with NO imports
        const firebaseConfig = {
            apiKey: "AIzaSyBkqlmjRHStXlzpvPA8baMjw5qSCiGg3QQ",
            authDomain: "tapflow-solutions.firebaseapp.com",
            projectId: "tapflow-solutions",
            storageBucket: "tapflow-solutions.firebasestorage.app",
            messagingSenderId: "1676801204",
            appId: "1:1676801204:web:ecb4eb73c2a01c04f993e1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = loginForm.querySelector('button');
            const originalText = btn.innerHTML;

            btn.innerText = 'Verifying...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error(error);
                let msg = "Login failed.";
                if (error.code === "auth/user-not-found") msg = "User does not exist.";
                else if (error.code === "auth/wrong-password") msg = "Incorrect password.";
                else msg = error.message;

                errorMsg.innerText = msg;
                errorMsg.style.display = 'block';
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        lucide.createIcons();
    </script>
</body>

</html>
